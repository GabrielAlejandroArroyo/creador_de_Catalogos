name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Versioned GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse changelog version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+' specs/changelog.md | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$VERSION" ]; then
            echo "No version found in specs/changelog.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag exists
        id: tag
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.version }} already exists — skip release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.version }} will be created"
          fi

      - name: Extract release notes
        if: steps.tag.outputs.exists == 'false'
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="## ${VERSION}" '
            $0 ~ "^## " {
              if (found) exit
              if (index($0, ver) == 1) { found=1; next }
            }
            found { print }
          ' specs/changelog.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${VERSION}" > /tmp/release-notes.md
          fi

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend artifact
        if: steps.tag.outputs.exists == 'false'
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production --base-href /creador_de_Catalogos/
          cd dist/frontend
          zip -r ../../../frontend-dist.zip .

      - name: Create tag and GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            frontend-dist.zip
